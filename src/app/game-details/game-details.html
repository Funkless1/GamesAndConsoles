@if(!!game) {
    <h1>{{game.name}}</h1>
    <h2>{{game.publisher}}</h2>
    <h2>{{game.price | currency}}</h2>
    <div>
        <img src="{{game.cover}}">
    </div>
    <div>
        <a routerLink="/console/{{console?.id}}">
            {{console?.name}}
        </a>
    </div>
}
@else {
    <div>game not found</div>
}
